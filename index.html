<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MEMECOIN</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', sans-serif;
      background: radial-gradient(circle at center, #ffcc00, #ff9900);
      color: #222;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.5rem;
    }

    .ca-box {
      background: #222;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      user-select: all;
      margin-top: 20px;
    }

    .ca-box:hover {
      background: #000;
    }

    img {
      max-width: 300px;
      margin-bottom: 2rem;
    }

    .copied {
      margin-top: 10px;
      color: green;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <img src="memecoin.png" alt="Meme Coin Logo" />
  <h1>MEMECOIN</h1>
  <p>The dumbest smart investment you'll ever make.</p>

  <div class="ca-box" onclick="copyCA()">CA: 98WSSwZLEepGRb5t4G8FQFGJNZ3TZe1wrr2gV2Ztpump</div>
  <div class="copied" id="copied-msg">Copied to clipboard!</div>

  <script>
    function copyCA() {
      const text = "98WSSwZLEepGRb5t4G8FQFGJNZ3TZe1wrr2gV2Ztpump";
      navigator.clipboard.writeText(text);
      const msg = document.getElementById("copied-msg");
      msg.style.display = "block";
      setTimeout(() => msg.style.display = "none", 2000);
    }
  </script>
</body>
</html>
